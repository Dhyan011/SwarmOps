services:
  # Backend API and GitHub App broker.
  - type: web
    name: swarmops-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: APP_STATE_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAX_CONCURRENT_INVESTIGATIONS
        value: "3"
      - key: INVESTIGATION_QUEUE_WAIT_SECONDS
        value: "5"
      - key: INVESTIGATION_TIMEOUT_SECONDS
        value: "900"

  # Vite frontend; public Supabase anon key is intentionally a build-time public value.
  - type: web
    name: swarmops-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: swarmops-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
